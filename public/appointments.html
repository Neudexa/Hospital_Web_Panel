<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randevu Al - Hastane Yönetim Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            width: 100%;
        }
        .doctor-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s;
        }
        .doctor-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .doc-name { font-size: 1.2rem; font-weight: 600; color: #fff; margin-bottom: 0.2rem; }
        .doc-role { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
        
        .slot-btn {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 8px;
            margin: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .slot-btn:hover {
            background: #10b981;
            color: #fff;
        }
        .no-slots { color: #fca5a5; font-size: 0.85rem; font-style: italic; }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="nav-content">
            <h1>Sağlık Portalı</h1>
            <div>
                <button class="outline-btn" style="margin-right: 10px;">Kullanıcı Paneli</button>
                <button class="outline-btn">Çıkış Yap</button>
            </div>
        </div>
    </nav>

    <div class="container panel-container" style="max-width: 1200px; flex-direction: column;">
        <div class="glass-panel" style="width: 100%;">
            <h2>Hızlı Randevu Al</h2>
            <p>Aşağıdan müsait olan doktorları ve randevu saatlerini seçerek anında randevunuzu oluşturabilirsiniz.</p>

            <div id="alert-box" class="alert hidden"></div>

            <div class="doctors-grid" id="doctors-container">
                <!-- Doktorlar buraya yüklenecek -->
                <p style="text-align: center; width: 100%;">Yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- Randevu Onay Modal -->
    <div id="notification-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <h3 id="modal-title">Bildirim</h3>
            <p id="modal-message"></p>
            <button class="primary-btn mt-4">Tamam</button>
        </div>
    </div>

    <script src="appointments_script.js"></script>
</body>
</body>
</html>
